workflows:
  pasha-satei-ios:
    name: パシャ査定 iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic7

    environment:
      ios_signing:
        provisioning_profiles:
          - Pasha_Satei_AppStore_New
        certificates:
          - Pasha_Satei_Distribution
      xcode: latest
      vars:
        XCODE_PROJECT: "PashaSatei.xcodeproj"
        XCODE_SCHEME: "PashaSatei"
        BUNDLE_ID: "com.shu39a.pashasatei"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set up code signing on PashaSatei project
        script: |
          xcode-project use-profiles             --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Show resolved Release signing settings
        script: |
          xcodebuild             -project "$CM_BUILD_DIR/$XCODE_PROJECT"             -scheme "$XCODE_SCHEME"             -configuration Release             -showBuildSettings |           egrep "CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa             --project "$CM_BUILD_DIR/$XCODE_PROJECT"             --scheme "$XCODE_SCHEME"

      - name: Verify App Store signature before upload
        script: |
          set -e
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Intermediates.noindex/ArchiveIntermediates/*/InstallationBuildProductsLocation/Applications/*.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/*.app" -print -quit)"
          fi
          echo "Checking: $APP_PATH"
          test -n "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee /tmp/pasha-signature.txt
          if ! grep -Eq "Authority=(Apple Distribution|iPhone Distribution)" /tmp/pasha-signature.txt; then
            echo "ERROR: App is not signed with an Apple distribution certificate."
            exit 1
          fi
          echo "PASS: App has an Apple distribution signature."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/pasha-signature.txt
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
